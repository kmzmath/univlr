<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#040306" />
    <title>UNIVLR</title>

    <!-- O cartao que aparece ao colar um link do site no WhatsApp, Discord ou
         Twitter. Este e o cartao GENERICO, e ele vale para qualquer endereco
         com `#`: tudo depois do `#` nunca chega ao servidor, entao o robo pede
         a raiz e recebe este arquivo, seja qual for a rota. Materia tem cartao
         proprio, em `/news/<slug>/`, gerado pelo scripts/build_news.js.
         A URL da imagem precisa ser absoluta - o robo nao resolve caminho
         relativo a partir da pagina. -->
    <meta name="description" content="Estatísticas do cenário universitário brasileiro de VALORANT: partidas, campeonatos, jogadores, rankings e o rAAting de cada um." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="UNIVLR" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://univlr.onrender.com/" />
    <meta property="og:title" content="UNIVLR" />
    <meta property="og:description" content="Estatísticas do cenário universitário brasileiro de VALORANT: partidas, campeonatos, jogadores, rankings e o rAAting de cada um." />
    <meta property="og:image" content="https://univlr.onrender.com/assets/share/univlr.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" href="assets/logo_univlr.png" />
    <link rel="preload" as="image" href="assets/univlr_logo_longa.png" />
    <link rel="preload" as="image" href="assets/logo_univlr.png" />
    <link rel="stylesheet" href="styles.css?v=309" />
    <link rel="stylesheet" href="placar.css?v=244" />
    <!-- Tema e fundo escolhidos no botao de aparencia. Sem defer: o atributo
         precisa estar no <html> antes da primeira pintura. -->
    <script src="ajustes.js?v=1"></script>

    <!-- Medicao de audiencia. `data-auto-pageview` desligado porque a rota do
         UNIVLR mora depois do `#` e nunca chega ao servidor: o automatico
         contaria uma visita por sessao inteira, e nao uma por pagina. Quem
         conta e o analytics.js, chamado pelo render(). O `data-before-send`
         aponta para a funcao que barra o envio na maquina local. -->
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="a8fcafd0-f69b-408f-9f23-7aff9c2dc791"
      data-auto-pageview="false"
      data-before-send="umamiBeforeSend"
    ></script>
  </head>
  <body>
    <div class="vp-fundo" aria-hidden="true"><i></i></div>
    <div id="app"></div>
    <script src="analytics.js?v=4"></script>
    <script src="db-codec.js?v=2"></script>
    <script src="raating-core.js?v=88"></script>
    <script src="ranking-core.js?v=90"></script>
    <!-- Comunidade. Antes do app.js porque ele chama Comments e Profile no
         render. Nenhum destes toca `state` na carga: `state` e const no app.js
         e ler antes dele executar cairia na zona morta temporal. -->
    <script src="supabase-js.js?v=2112004"></script>
    <script src="community-core.js?v=14"></script>
    <script src="comments.js?v=18"></script>
    <script src="profile.js?v=6"></script>
    <script src="favorites.js?v=3"></script>
    <script src="news.js?v=21"></script>
    <script src="threads.js?v=5"></script>
    <script src="auth.js?v=9"></script>
    <script src="dica.js?v=2"></script>
    <script src="app.js?v=412"></script>
  </body>
</html>
